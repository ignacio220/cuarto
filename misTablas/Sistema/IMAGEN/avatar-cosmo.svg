<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="cosmoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="56" fill="url(#cosmoBg)" stroke="#A78BFA" stroke-width="4"/>
  <!-- Stars background -->
  <circle cx="28" cy="28" r="2.5" fill="#FDE047"/>
  <circle cx="95" cy="35" r="2" fill="#FDE047"/>
  <circle cx="85" cy="90" r="2" fill="#FDE047"/>
  <circle cx="30" cy="85" r="1.5" fill="#FDE047"/>
