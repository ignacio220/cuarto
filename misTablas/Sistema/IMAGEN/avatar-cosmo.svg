  <line x1="60" y1="26" x2="60" y2="15" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
  <circle cx="60" cy="13" r="4.5" fill="#EF4444"/>
  <!-- Helmet Outer -->
  <circle cx="60" cy="58" r="32" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
  <!-- Helmet Visor -->
  <ellipse cx="60" cy="58" rx="23" ry="19" fill="url(#visorGrad)" stroke="#0284C7" stroke-width="2"/>
  <!-- Visor Reflection -->
  <path d="M 45 48 Q 58 44 68 47 Q 66 51 52 51 Z" fill="#FFFFFF" opacity="0.6"/>
  <!-- Cute Astronaut Eyes inside visor -->
  <ellipse cx="53" cy="59" rx="3.5" ry="4.5" fill="#FFFFFF"/>
