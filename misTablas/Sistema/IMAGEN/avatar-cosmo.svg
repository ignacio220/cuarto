  <circle cx="54" cy="58" r="1.8" fill="#0F172A"/>
  <circle cx="68" cy="58" r="1.8" fill="#0F172A"/>
  <!-- Cheeks -->
  <circle cx="47" cy="66" r="3" fill="#F472B6" opacity="0.8"/>
  <circle cx="73" cy="66" r="3" fill="#F472B6" opacity="0.8"/>
  <!-- Smile -->
  <path d="M 57 66 Q 60 69 63 66" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Collar / Suit top -->
  <path d="M 38 88 Q 60 96 82 88 L 86 112 Q 60 118 34 112 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2.5"/>
  <rect x="52" y="93" width="16" height="8" rx="3" fill="#3B82F6"/>
