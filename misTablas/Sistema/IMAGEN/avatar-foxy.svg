      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="foxFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <circle cx="60" cy="60" r="56" fill="url(#foxyBg)" stroke="#FDBA74" stroke-width="4"/>
  <!-- Ears -->
  <polygon points="30,50 36,18 54,42" fill="url(#foxFur)"/>
  <polygon points="35,46 39,24 50,42" fill="#FEF08A"/>
  <polygon points="90,50 84,18 66,42" fill="url(#foxFur)"/>
  <polygon points="85,46 81,24 70,42" fill="#FEF08A"/>
  <!-- Fox Head -->
