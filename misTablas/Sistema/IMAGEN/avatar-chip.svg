<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="chipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="robotBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <circle cx="60" cy="60" r="56" fill="url(#chipBg)" stroke="#38BDF8" stroke-width="4"/>
  <!-- Circuits decor -->
  <line x1="20" y1="30" x2="35" y2="30" stroke="#7DD3FC" stroke-width="2"/>
  <circle cx="35" cy="30" r="3" fill="#7DD3FC"/>
  <line x1="100" y1="90" x2="85" y2="90" stroke="#7DD3FC" stroke-width="2"/>
  <circle cx="85" cy="90" r="3" fill="#7DD3FC"/>
  <!-- Antenna -->
  <line x1="60" y1="28" x2="60" y2="15" stroke="#94A3B8" stroke-width="3"/>
  <circle cx="60" cy="14" r="5" fill="#F59E0B"/>
  <circle cx="60" cy="14" r="2" fill="#FEF08A"/>
  <!-- Robot Ears / Bolts -->
  <rect x="25" y="45" width="8" height="14" rx="3" fill="#94A3B8"/>
  <rect x="87" y="45" width="8" height="14" rx="3" fill="#94A3B8"/>
  <!-- Head -->
  <rect x="30" y="28" width="60" height="48" rx="14" fill="url(#robotBody)" stroke="#94A3B8" stroke-width="2.5"/>
  <!-- Screen face -->
  <rect x="36" y="34" width="48" height="36" rx="9" fill="#0F172A"/>
  <!-- Robot Eyes (Cyan Glow LED) -->
  <rect x="43" y="42" width="12" height="10" rx="3" fill="#22D3EE"/>
  <rect x="65" y="42" width="12" height="10" rx="3" fill="#22D3EE"/>
  <!-- Eye glint -->
  <circle cx="46" cy="45" r="1.5" fill="#FFFFFF"/>
  <circle cx="68" cy="45" r="1.5" fill="#FFFFFF"/>
  <!-- Robot Smile (pixels) -->
  <path d="M 48 60 Q 60 67 72 60" stroke="#22D3EE" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Cheeks -->
  <circle cx="41" cy="56" r="2.5" fill="#F472B6"/>
  <circle cx="79" cy="56" r="2.5" fill="#F472B6"/>
  <!-- Body & Neck -->
  <rect x="52" y="76" width="16" height="6" fill="#94A3B8"/>
  <path d="M 36 82 L 84 82 L 88 114 L 32 114 Z" fill="url(#robotBody)" stroke="#94A3B8" stroke-width="2.5"/>
  <!-- Chest Meter & Math symbol -->
  <rect x="46" y="88" width="28" height="14" rx="4" fill="#0F172A"/>
  <text x="60" y="99" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34D399" text-anchor="middle">× 9</text>
</svg>
